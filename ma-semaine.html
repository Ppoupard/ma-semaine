<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Semaine">
<meta name="theme-color" content="#FAF9F6">
<title>Ma Semaine — ASI Mûrs-Érigné</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F6;
    --surface:#FFFFFF;
    --ink:#221B1C;
    --ink-soft:#78706E;
    --line:#EBE2E0;
    --red:#B3182A;
    --red-dark:#8F1220;
    --red-soft:#FBE7E6;
    --navy:#2C4570;
    --navy-soft:#E7ECF5;
    --amber:#C4772A;
    --amber-soft:#FAEDDD;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(30,20,20,.05), 0 6px 18px -10px rgba(30,20,20,.18);
    --shadow-sheet:0 -8px 30px rgba(20,14,14,.22);
    --header-h:150px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button, input{font-family:inherit;}
  button{border:none; background:none; cursor:pointer; color:inherit;}
  .num{font-family:'Barlow Condensed', 'Inter', sans-serif; font-weight:700;}
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }

  .app{ max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:calc(120px + env(safe-area-inset-bottom)); position:relative; }

  /* ---------- HEADER ---------- */
  .topbar-wrap{
    position:sticky; top:0; z-index:20;
    background:rgba(250,249,246,.88);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .topbar-wrap::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--red), var(--red-dark));
  }
  .topbar{ padding:calc(16px + env(safe-area-inset-top)) 20px 4px; }
  .brand-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .crest{ flex:0 0 auto; width:38px; height:38px; filter:drop-shadow(0 2px 4px rgba(179,24,42,.25)); }
  .brand-text{ display:flex; flex-direction:column; gap:1px; }
  .eyebrow{ font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:13px; letter-spacing:.13em; color:var(--red); }
  .club-tag{ font-size:11.5px; font-weight:600; color:var(--ink-soft); }

  .week-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .nav-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line);
    flex:0 0 auto; transition:transform .12s ease, background .12s ease;
  }
  .nav-btn:active{ background:var(--red-soft); transform:scale(.92); }
  .nav-btn svg{ width:18px; height:18px; stroke:var(--ink); }
  .week-label-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .week-label{ font-size:22px; text-transform:capitalize; transition:opacity .15s ease; }
  .today-jump{ font-size:12px; font-weight:600; color:var(--red); padding:2px 10px; border-radius:999px; background:var(--red-soft); transition:transform .12s ease; }
  .today-jump:active{ transform:scale(.94); }

  .recap-row{ display:flex; justify-content:center; gap:16px; padding:8px 20px 12px; }
  .recap-item{ display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .recap-dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }

  /* ---------- QUICK NAV STRIP ---------- */
  .quicknav{ display:flex; gap:6px; padding:0 20px 12px; justify-content:space-between; }
  .qn-dot{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:6px 0; border-radius:10px; color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .qn-dot:active{ transform:scale(.92); }
  .qn-day{ font-size:9.5px; font-weight:700; letter-spacing:.03em; }
  .qn-num{ font-size:15px; color:var(--ink); }
  .qn-dot.active{ background:var(--red); }
  .qn-dot.active .qn-day, .qn-dot.active .qn-num{ color:#fff; }
  .qn-dot.is-today:not(.active){ color:var(--red); }
  .qn-dot.is-today:not(.active) .qn-num{ color:var(--red); }

  /* ---------- DAY LIST ---------- */
  .day-list-wrap{ overflow:hidden; }
  #dayListInner{ padding:18px 20px 0; transition:transform .22s cubic-bezier(.32,.72,0,1), opacity .22s ease; }
  .slide-out-left{ transform:translateX(-22px); opacity:0; }
  .slide-out-right{ transform:translateX(22px); opacity:0; }
  .slide-in-right{ transform:translateX(22px); opacity:0; transition:none !important; }
  .slide-in-left{ transform:translateX(-22px); opacity:0; transition:none !important; }

  .day-section{ margin-bottom:26px; scroll-margin-top:calc(var(--header-h) + 10px); }
  .day-head{ display:flex; align-items:center; gap:12px; padding-bottom:10px; border-bottom:1px dashed var(--line); margin-bottom:12px; }
  .day-badge{
    width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto;
    transition:background .15s, border-color .15s, color .15s;
  }
  .day-badge.filled{ background:var(--red); border-color:var(--red); color:#fff; }
  .day-info{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .day-name{ font-weight:600; font-size:15px; }
  .today-chip{ font-size:11px; font-weight:700; color:var(--red); background:var(--red-soft); padding:2px 8px; border-radius:999px; }

  .day-events{ display:flex; flex-direction:column; gap:8px; transition:opacity .2s ease; }
  .day-section.is-past .day-events{ opacity:.5; }

  .now-marker{ display:flex; align-items:center; gap:8px; margin:4px 2px 2px; }
  .now-dot{ width:7px; height:7px; border-radius:50%; background:var(--red); flex:0 0 auto; box-shadow:0 0 0 3px var(--red-soft); }
  .now-label{ font-size:10.5px; font-weight:700; color:var(--red); letter-spacing:.05em; text-transform:uppercase; }
  .now-line{ flex:1; height:1px; background:var(--red); opacity:.3; }

  @keyframes cardIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .event-card-wrap, .empty-add{ animation:cardIn .32s ease both; }
  .event-card-wrap{ position:relative; }

  .swipe-bg{
    position:absolute; inset:0; background:#C43D3D; border-radius:var(--radius-md); color:#fff;
    display:flex; align-items:center; justify-content:flex-end; gap:6px; padding-right:22px;
    font-weight:700; font-size:13px;
  }

  .event-card{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:12px; background:var(--surface);
    border-radius:var(--radius-md); padding:12px 14px; box-shadow:var(--shadow-card);
    border-left:4px solid var(--cat-color); text-align:left; width:100%;
  }
  .event-card:active{ transform:scale(.98); }
  .event-time{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:15px;
    display:flex; flex-direction:column; align-items:flex-start; line-height:1.25;
    color:var(--ink); min-width:52px; flex:0 0 auto;
  }
  .event-time-sep{ width:10px; height:1px; background:var(--line); margin:2px 0; }
  .event-main{ flex:1; min-width:0; }
  .event-title{ font-weight:600; font-size:14.5px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .event-meta{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
  .cat-dot{ width:7px; height:7px; border-radius:50%; background:var(--cat-color); display:inline-block; }
  .recur-icon{ margin-left:2px; opacity:.6; }

  .empty-add{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    padding:14px 14px; border-radius:var(--radius-md); border:1px dashed var(--line);
    color:var(--ink-soft); font-size:13.5px; transition:transform .1s ease, border-color .15s ease;
  }
  .empty-add:active{ transform:scale(.98); border-color:var(--red); }
  .empty-add .empty-plus{ color:var(--red); font-weight:600; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; background:var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px -6px rgba(179,24,42,.55); z-index:25; transition:transform .12s ease;
  }
  .fab:active{ transform:scale(.94); }
  .fab svg{ width:26px; height:26px; stroke:#fff; transition:transform .25s ease; }
  .fab.is-open svg{ transform:rotate(45deg); }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%, 12px); opacity:0; pointer-events:none;
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
    padding:10px 18px; border-radius:999px; box-shadow:0 8px 20px rgba(0,0,0,.25);
    transition:transform .22s ease, opacity .22s ease; z-index:40; white-space:nowrap;
  }
  .toast.show{ transform:translate(-50%, 0); opacity:1; }

  /* ---------- SHEET ---------- */
  .backdrop{ position:fixed; inset:0; background:rgba(20,14,14,.4); opacity:0; pointer-events:none; transition:opacity .25s; z-index:30; }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31; max-width:560px; margin:0 auto;
    background:var(--surface); border-radius:24px 24px 0 0; box-shadow:var(--shadow-sheet);
    transform:translateY(105%); transition:transform .3s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto; padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:999px; margin:10px auto 4px; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px 14px; border-bottom:1px solid var(--line); }
  .sheet-cancel{ font-size:15px; color:var(--ink-soft); padding:6px; }
  .sheet-title{ font-weight:700; font-size:15px; }
  .sheet-save{ font-size:15px; font-weight:700; color:var(--red); padding:6px; }

  .sheet-body{ padding:18px 20px 6px; display:flex; flex-direction:column; gap:16px; }
  .title-input{ font-size:17px; font-weight:600; padding:12px 14px; border:1.5px solid var(--line); border-radius:var(--radius-sm); width:100%; outline:none; background:var(--bg); }
  .title-input:focus{ border-color:var(--red); }

  .field-label{ font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:.03em; text-transform:uppercase; margin-bottom:8px; display:block; }

  .cat-chips{ display:flex; gap:8px; }
  .cat-chip{ flex:1; padding:10px 6px; border-radius:999px; text-align:center; font-size:13.5px; font-weight:600; border:1.5px solid var(--chip-color); color:var(--chip-color); transition:background .15s, color .15s, transform .1s; }
  .cat-chip:active{ transform:scale(.96); }
  .cat-chip.selected{ background:var(--chip-color); color:#fff; }

  .day-chips{ display:flex; gap:6px; justify-content:space-between; }
  .day-chip{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0; border-radius:12px; border:1.5px solid var(--line); color:var(--ink-soft); transition:background .15s, border-color .15s, transform .1s; }
  .day-chip:active{ transform:scale(.94); }
  .day-chip .chip-day{ font-size:10.5px; font-weight:700; letter-spacing:.02em; }
  .day-chip .chip-num{ font-size:17px; color:var(--ink); }
  .day-chip.selected{ background:var(--red-soft); border-color:var(--red); }
  .day-chip.selected .chip-day, .day-chip.selected .chip-num{ color:var(--red); }

  .time-row{ display:flex; gap:12px; }
  .time-field{ flex:1; }
  .time-field input{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:var(--radius-sm); font-size:16px; background:var(--bg); outline:none; }
  .time-field input:focus{ border-color:var(--red); }
  .time-error{ font-size:12.5px; color:var(--red); margin-top:-8px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; font-size:14.5px; font-weight:500; padding:4px 0; }
  .switch{ position:relative; display:inline-block; width:46px; height:28px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch-track{ position:absolute; inset:0; background:#E3D9D7; border-radius:999px; transition:background .2s; }
  .switch-thumb{ position:absolute; top:2px; left:2px; width:24px; height:24px; background:#fff; border-radius:50%; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .switch input:checked + .switch-track{ background:var(--red); }
  .switch input:checked + .switch-track .switch-thumb{ transform:translateX(18px); }

  .delete-btn{ margin-top:4px; padding:12px; text-align:center; font-size:14.5px; font-weight:600; color:#C43D3D; border-radius:var(--radius-sm); background:#FBEBEA; transition:transform .1s ease; }
  .delete-btn:active{ transform:scale(.98); }

  .skeleton{ height:74px; border-radius:var(--radius-md); background:linear-gradient(90deg,#EFEAE8 25%,#F6F3F1 37%,#EFEAE8 63%); background-size:400% 100%; animation:shimmer 1.4s infinite; margin-bottom:8px; }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
</style>
</head>
<body>

<div class="app">
  <header class="topbar-wrap" id="topbarWrap">
    <div class="topbar">
      <div class="brand-row">
        <svg class="crest" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="29.5" fill="#B3182A" stroke="#fff" stroke-width="3"/>
          <text x="32" y="38" text-anchor="middle" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="21" fill="#fff" letter-spacing="1">ASI</text>
          <path d="M15 43 Q32 51 49 43" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>
        </svg>
        <div class="brand-text">
          <div class="eyebrow">MA SEMAINE</div>
          <div class="club-tag">ASI Mûrs-Érigné</div>
        </div>
      </div>
      <div class="week-nav">
        <button class="nav-btn" id="prevWeek" aria-label="Semaine précédente">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="week-label-wrap">
          <div class="week-label num" id="weekLabel">—</div>
          <button class="today-jump" id="todayJump" style="display:none;">Aujourd'hui</button>
        </div>
        <button class="nav-btn" id="nextWeek" aria-label="Semaine suivante">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="recap-row" id="recapRow"></div>
    </div>
    <div class="quicknav" id="quicknav"></div>
  </header>

  <main class="day-list-wrap">
    <div id="dayListInner">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>

  <button class="fab" id="fabAdd" aria-label="Ajouter un créneau">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="cancelBtn">Annuler</button>
    <div class="sheet-title" id="sheetTitle">Nouveau créneau</div>
    <button class="sheet-save" id="saveBtn">OK</button>
  </div>
  <div class="sheet-body">
    <input type="text" id="titleInput" class="title-input" placeholder="Titre (ex. Entraînement U15)" maxlength="60">

    <div>
      <span class="field-label">Catégorie</span>
      <div class="cat-chips" id="catChips">
        <button type="button" class="cat-chip" data-cat="foot" style="--chip-color:#B3182A;">Foot</button>
        <button type="button" class="cat-chip" data-cat="ecole" style="--chip-color:#2C4570;">École</button>
        <button type="button" class="cat-chip" data-cat="perso" style="--chip-color:#C4772A;">Perso</button>
      </div>
    </div>

    <div>
      <span class="field-label">Jour</span>
      <div class="day-chips" id="dayChips"></div>
    </div>

    <div class="time-row">
      <div class="time-field">
        <span class="field-label">Début</span>
        <input type="time" id="startInput" value="18:00">
      </div>
      <div class="time-field">
        <span class="field-label">Fin</span>
        <input type="time" id="endInput" value="19:00">
      </div>
    </div>
    <div class="time-error" id="timeError" style="display:none;">L'heure de fin doit être après le début.</div>

    <label class="toggle-row">
      <span>Se répète chaque semaine</span>
      <span class="switch">
        <input type="checkbox" id="recurringToggle" checked>
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </span>
    </label>

    <button class="delete-btn" id="deleteBtn" style="display:none;">Supprimer ce créneau</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'events';
  let events = [];
  let weekOffset = 0;
  let editingId = null;
  let selectedCategory = 'foot';
  let selectedDayIndex = 0;
  let cardCounter = 0;

  const FR_DAYS_LONG = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const FR_DAYS_CHIP = ['LU','MA','ME','JE','VE','SA','DI'];
  const FR_MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

  const CATEGORIES = {
    foot:  { label:'Foot',  color:'#B3182A' },
    ecole: { label:'École', color:'#2C4570' },
    perso: { label:'Perso', color:'#C4772A' }
  };

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function isoDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function currentWeekStart(){ return addDays(getMonday(new Date()), weekOffset * 7); }
  function weekDates(){ const start = currentWeekStart(); return Array.from({length:7}, (_,i)=>addDays(start,i)); }
  function escapeHTML(str){ const div=document.createElement('div'); div.textContent = str; return div.innerHTML; }
  function uid(){ return 'ev_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function formatWeekLabel(dates){
    const first = dates[0], last = dates[6];
    if(first.getMonth() === last.getMonth()){
      return first.getDate() + ' – ' + last.getDate() + ' ' + FR_MONTHS[first.getMonth()];
    }
    return first.getDate() + ' ' + FR_MONTHS[first.getMonth()] + ' – ' + last.getDate() + ' ' + FR_MONTHS[last.getMonth()];
  }

  function minutesBetween(start, end){
    const s = start.split(':').map(Number), e = end.split(':').map(Number);
    return (e[0]*60 + e[1]) - (s[0]*60 + s[1]);
  }
  function formatHours(min){
    const total = Math.max(0, Math.round(min));
    const h = Math.floor(total/60), m = total % 60;
    if(h === 0 && m === 0) return '0h';
    return m ? (h + 'h' + pad(m)) : (h + 'h');
  }

  async function loadEvents(){
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(STORAGE_KEY, false);
        events = (res && res.value) ? JSON.parse(res.value) : [];
        return;
      }
    }catch(e){ /* on bascule sur le stockage local du navigateur */ }
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      events = raw ? JSON.parse(raw) : [];
    }catch(e){ events = []; }
  }
  async function saveEvents(){
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(STORAGE_KEY, JSON.stringify(events), false);
        return;
      }
    }catch(e){ /* on bascule sur le stockage local du navigateur */ }
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }
    catch(e){ console.error('Erreur de sauvegarde', e); }
  }

  function eventsForDate(date, weekdayIdx){
    const diso = isoDate(date);
    return events
      .filter(e => (e.recurring && e.weekday === weekdayIdx) || (!e.recurring && e.date === diso))
      .sort((a,b) => a.startTime.localeCompare(b.startTime));
  }

  function computeCategoryTotals(dates){
    const totals = { foot:0, ecole:0, perso:0 };
    dates.forEach((date, idx) => {
      eventsForDate(date, idx).forEach(ev => {
        const mins = minutesBetween(ev.startTime, ev.endTime);
        if(totals.hasOwnProperty(ev.category)) totals[ev.category] += Math.max(0, mins);
      });
    });
    return totals;
  }

  function eventCardHTML(ev){
    const cat = CATEGORIES[ev.category] || CATEGORIES.perso;
    const delay = (cardCounter++ * 35);
    return '<div class="event-card-wrap" style="animation-delay:' + delay + 'ms">' +
      '<div class="swipe-bg"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg><span>Supprimer</span></div>' +
      '<button type="button" class="event-card" data-id="' + ev.id + '" style="--cat-color:' + cat.color + '">' +
        '<div class="event-time"><span>' + ev.startTime + '</span><span class="event-time-sep"></span><span>' + ev.endTime + '</span></div>' +
        '<div class="event-main">' +
          '<div class="event-title">' + escapeHTML(ev.title) + '</div>' +
          '<div class="event-meta"><span class="cat-dot"></span>' + cat.label + (ev.recurring ? '<span class="recur-icon">↻</span>' : '') + '</div>' +
        '</div>' +
      '</button>' +
    '</div>';
  }
  function emptyStateHTML(dayIdx, diso){
    const delay = (cardCounter++ * 35);
    return '<button type="button" class="empty-add" data-day="' + dayIdx + '" data-date="' + diso + '" style="animation-delay:' + delay + 'ms">' +
      '<span>Rien de prévu</span><span class="empty-plus">+ Ajouter</span></button>';
  }
  function nowMarkerHTML(){
    return '<div class="now-marker"><span class="now-dot"></span><span class="now-label">Maintenant</span><span class="now-line"></span></div>';
  }

  function renderHeader(dates){
    document.getElementById('weekLabel').textContent = formatWeekLabel(dates);
    document.getElementById('todayJump').style.display = weekOffset !== 0 ? 'inline-block' : 'none';
  }

  function renderRecap(dates){
    const totals = computeCategoryTotals(dates);
    document.getElementById('recapRow').innerHTML =
      '<span class="recap-item"><span class="recap-dot" style="background:' + CATEGORIES.foot.color + '"></span>' + formatHours(totals.foot) + '</span>' +
      '<span class="recap-item"><span class="recap-dot" style="background:' + CATEGORIES.ecole.color + '"></span>' + formatHours(totals.ecole) + '</span>' +
      '<span class="recap-item"><span class="recap-dot" style="background:' + CATEGORIES.perso.color + '"></span>' + formatHours(totals.perso) + '</span>';
  }

  function renderQuickNav(dates){
    const todayIso = isoDate(new Date());
    const qn = document.getElementById('quicknav');
    qn.innerHTML = dates.map((d,i) => {
      const isToday = isoDate(d) === todayIso;
      return '<button type="button" class="qn-dot' + (isToday ? ' is-today' : '') + '" data-idx="' + i + '">' +
        '<span class="qn-day">' + FR_DAYS_CHIP[i] + '</span><span class="qn-num num">' + d.getDate() + '</span></button>';
    }).join('');
    qn.querySelectorAll('.qn-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const idx = parseInt(dot.dataset.idx, 10);
        const sections = document.querySelectorAll('.day-section');
        if(sections[idx]) sections[idx].scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function attachCardSwipe(){
    document.querySelectorAll('.event-card').forEach(card => {
      let startX = 0, startY = 0, dx = 0, tracking = false, horizontal = false, swiped = false;

      card.addEventListener('touchstart', e => {
        if(e.touches.length !== 1) return;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        dx = 0; tracking = true; horizontal = false; swiped = false;
        e.stopPropagation();
      }, {passive:true});

      card.addEventListener('touchmove', e => {
        if(!tracking) return;
        const x = e.touches[0].clientX, y = e.touches[0].clientY;
        const ddx = x - startX, ddy = y - startY;
        if(!horizontal){
          if(Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy) * 1.3){
            horizontal = true;
            card.style.transition = 'none';
          } else if(Math.abs(ddy) > 8){
            tracking = false;
            return;
          }
        }
        if(horizontal){
          dx = Math.min(0, ddx);
          card.style.transform = 'translateX(' + dx + 'px)';
          if(Math.abs(dx) > 12) swiped = true;
          e.stopPropagation();
        }
      }, {passive:true});

      card.addEventListener('touchend', e => {
        if(!tracking) return;
        tracking = false;
        if(horizontal){
          card.style.transition = 'transform .2s ease';
          if(dx < -90){
            card.style.transform = 'translateX(-110%)';
            const id = card.dataset.id;
            setTimeout(() => commitDelete(id), 180);
          } else {
            card.style.transform = 'translateX(0)';
            setTimeout(() => { card.style.transition = ''; card.style.transform = ''; }, 210);
          }
        }
        e.stopPropagation();
      }, {passive:true});

      card.addEventListener('touchcancel', () => {
        tracking = false;
        if(horizontal){
          card.style.transition = 'transform .2s ease';
          card.style.transform = 'translateX(0)';
          setTimeout(() => { card.style.transition = ''; card.style.transform = ''; }, 210);
        }
      }, {passive:true});

      card.addEventListener('click', () => {
        if(swiped){ swiped = false; return; }
        openSheet(card.dataset.id);
      });
    });
  }

  async function commitDelete(id){
    events = events.filter(e => e.id !== id);
    await saveEvents();
    renderDays(weekDates());
    showToast('Créneau supprimé');
  }

  function renderDays(dates){
    const todayIso = isoDate(new Date());
    const nowDate = new Date();
    const nowStr = pad(nowDate.getHours()) + ':' + pad(nowDate.getMinutes());
    cardCounter = 0;
    let html = '';
    dates.forEach((date, idx) => {
      const diso = isoDate(date);
      const isToday = diso === todayIso;
      const isPast = weekOffset === 0 && diso < todayIso;
      const dayEvents = eventsForDate(date, idx);

      let eventsHTML;
      if(dayEvents.length){
        const parts = dayEvents.map(eventCardHTML);
        if(isToday){
          let insertIdx = dayEvents.findIndex(e => e.startTime > nowStr);
          if(insertIdx === -1) insertIdx = dayEvents.length;
          parts.splice(insertIdx, 0, nowMarkerHTML());
        }
        eventsHTML = parts.join('');
      } else {
        eventsHTML = emptyStateHTML(idx, diso);
      }

      html += '<section class="day-section' + (isPast ? ' is-past' : '') + '">' +
        '<div class="day-head">' +
          '<div class="day-badge' + (isToday ? ' filled' : '') + '"><span class="num">' + date.getDate() + '</span></div>' +
          '<div class="day-info">' +
            '<span class="day-name">' + FR_DAYS_LONG[idx] + '</span>' +
            (isToday ? '<span class="today-chip">Aujourd\'hui</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="day-events">' + eventsHTML + '</div>' +
      '</section>';
    });
    const inner = document.getElementById('dayListInner');
    inner.innerHTML = html;

    attachCardSwipe();
    inner.querySelectorAll('.empty-add').forEach(btn => {
      btn.addEventListener('click', () => openSheet(null, parseInt(btn.dataset.day, 10)));
    });
    updateActiveDay();
  }

  function measureHeader(){
    const h = document.getElementById('topbarWrap').offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }

  function updateActiveDay(){
    const headerH = document.getElementById('topbarWrap').offsetHeight;
    const sections = document.querySelectorAll('.day-section');
    const dots = document.querySelectorAll('.qn-dot');
    if(!sections.length || !dots.length) return;
    let activeIdx = 0;
    sections.forEach((sec, i) => {
      const rect = sec.getBoundingClientRect();
      if(rect.top - headerH <= 40) activeIdx = i;
    });
    dots.forEach((dot,i) => dot.classList.toggle('active', i === activeIdx));
  }

  function renderAll(){
    const dates = weekDates();
    renderHeader(dates);
    renderRecap(dates);
    renderQuickNav(dates);
    renderDays(dates);
    measureHeader();
  }

  function goToWeek(newOffset, direction){
    const inner = document.getElementById('dayListInner');
    inner.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');
    setTimeout(() => {
      weekOffset = newOffset;
      const dates = weekDates();
      renderHeader(dates);
      renderRecap(dates);
      renderQuickNav(dates);
      inner.classList.remove('slide-out-left', 'slide-out-right');
      inner.classList.add(direction > 0 ? 'slide-in-right' : 'slide-in-left');
      renderDays(dates);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          inner.classList.remove('slide-in-right', 'slide-in-left');
        });
      });
      measureHeader();
    }, 190);
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(() => t.classList.remove('show'), 1700);
  }

  function openSheet(id, presetDayIdx){
    editingId = id;
    const dates = weekDates();

    document.getElementById('dayChips').innerHTML = dates.map((d,i) =>
      '<button type="button" class="day-chip" data-idx="' + i + '">' +
        '<span class="chip-day">' + FR_DAYS_CHIP[i] + '</span><span class="chip-num num">' + d.getDate() + '</span>' +
      '</button>'
    ).join('');
    document.querySelectorAll('.day-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        selectedDayIndex = parseInt(chip.dataset.idx, 10);
        document.querySelectorAll('.day-chip').forEach(c => c.classList.toggle('selected', c === chip));
      });
    });

    let ev = null;
    if(id){ ev = events.find(e => e.id === id); }

    document.getElementById('sheetTitle').textContent = id ? 'Modifier' : 'Nouveau créneau';
    document.getElementById('titleInput').value = ev ? ev.title : '';
    document.getElementById('startInput').value = ev ? ev.startTime : '18:00';
    document.getElementById('endInput').value = ev ? ev.endTime : '19:00';
    document.getElementById('recurringToggle').checked = ev ? ev.recurring : true;
    document.getElementById('timeError').style.display = 'none';

    selectedCategory = ev ? ev.category : 'foot';
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('selected', c.dataset.cat === selectedCategory));

    let dayIdx;
    if(ev){
      dayIdx = ev.recurring ? ev.weekday : dates.findIndex(d => isoDate(d) === ev.date);
      if(dayIdx < 0) dayIdx = ev.weekday || 0;
    } else if(presetDayIdx !== undefined && presetDayIdx !== null && !isNaN(presetDayIdx)){
      dayIdx = presetDayIdx;
    } else {
      const todayIdx = dates.findIndex(d => isoDate(d) === isoDate(new Date()));
      dayIdx = todayIdx >= 0 ? todayIdx : 0;
    }
    selectedDayIndex = dayIdx;
    document.querySelectorAll('.day-chip').forEach(c => c.classList.toggle('selected', parseInt(c.dataset.idx,10) === dayIdx));

    document.getElementById('deleteBtn').style.display = id ? 'block' : 'none';

    document.getElementById('backdrop').classList.add('open');
    document.getElementById('sheet').classList.add('open');
    document.getElementById('sheet').setAttribute('aria-hidden', 'false');
    document.getElementById('fabAdd').classList.add('is-open');
  }

  function closeSheet(){
    document.getElementById('backdrop').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('sheet').setAttribute('aria-hidden', 'true');
    document.getElementById('fabAdd').classList.remove('is-open');
    editingId = null;
  }

  async function handleSave(){
    const title = document.getElementById('titleInput').value.trim();
    if(!title){ document.getElementById('titleInput').focus(); return; }
    const start = document.getElementById('startInput').value || '18:00';
    const end = document.getElementById('endInput').value || '19:00';
    if(end <= start){
      document.getElementById('timeError').style.display = 'block';
      return;
    }
    document.getElementById('timeError').style.display = 'none';

    const recurring = document.getElementById('recurringToggle').checked;
    const dates = weekDates();
    const chosenDate = dates[selectedDayIndex];

    const payload = {
      id: editingId || uid(),
      title: title,
      category: selectedCategory,
      weekday: selectedDayIndex,
      startTime: start,
      endTime: end,
      recurring: recurring,
      date: recurring ? null : isoDate(chosenDate)
    };

    const wasEditing = !!editingId;
    if(editingId){
      const i = events.findIndex(e => e.id === editingId);
      if(i >= 0) events[i] = payload;
    } else {
      events.push(payload);
    }
    await saveEvents();
    closeSheet();
    renderRecap(weekDates());
    renderDays(weekDates());
    showToast(wasEditing ? 'Créneau modifié' : 'Créneau enregistré');
  }

  async function handleDelete(){
    if(!editingId) return;
    events = events.filter(e => e.id !== editingId);
    await saveEvents();
    closeSheet();
    renderRecap(weekDates());
    renderDays(weekDates());
    showToast('Créneau supprimé');
  }

  function init(){
    document.getElementById('prevWeek').addEventListener('click', () => goToWeek(weekOffset - 1, -1));
    document.getElementById('nextWeek').addEventListener('click', () => goToWeek(weekOffset + 1, 1));
    document.getElementById('todayJump').addEventListener('click', () => {
      const dir = weekOffset > 0 ? -1 : 1;
      goToWeek(0, dir);
    });
    document.getElementById('fabAdd').addEventListener('click', () => {
      const dates = weekDates();
      const todayIdx = weekOffset === 0 ? dates.findIndex(d => isoDate(d) === isoDate(new Date())) : 0;
      openSheet(null, todayIdx >= 0 ? todayIdx : 0);
    });
    document.getElementById('cancelBtn').addEventListener('click', closeSheet);
    document.getElementById('backdrop').addEventListener('click', closeSheet);
    document.getElementById('saveBtn').addEventListener('click', handleSave);
    document.getElementById('deleteBtn').addEventListener('click', handleDelete);

    document.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        selectedCategory = chip.dataset.cat;
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('selected', c === chip));
      });
    });

    let touchStartX = 0, touchStartY = 0, tracking = false;
    const wrap = document.querySelector('.day-list-wrap');
    wrap.addEventListener('touchstart', e => {
      if(e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      tracking = true;
    }, {passive:true});
    wrap.addEventListener('touchend', e => {
      if(!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5){
        const dir = dx < 0 ? 1 : -1;
        goToWeek(weekOffset + dir, dir);
      }
    }, {passive:true});

    window.addEventListener('scroll', () => requestAnimationFrame(updateActiveDay), {passive:true});
    window.addEventListener('resize', () => requestAnimationFrame(measureHeader));

    loadEvents().then(renderAll);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
